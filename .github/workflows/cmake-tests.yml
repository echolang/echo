name: Tests

on:
  push:
    branches:
      - master
    paths-ignore: &docs_only
      - 'docs/**'
      - 'docs_legacy/**'
      - 'notes/**'
      - 'todo/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *docs_only
  workflow_dispatch:

permissions:
  contents: read

# master is serialized rather than cancelled: the patch number is resolved from the tags that exist
# when a run starts, so two pushes landing close together would otherwise both resolve to the same
# one and the second would fail on an existing tag. On a branch there is nothing to serialize, and a
# stale run is just work nobody is waiting for
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  # host `echoc test` of stdlib runs last here, after the upload. cheaper than the e2e corpus, so it
  # gates those shards: a stdlib failure skips e2e rather than burning time on tests_eco. no WASI:
  # `echoc test` is the host. unit stays beside this, not behind it
  build_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BUILD_TYPE: RelWithDebInfo
      USE_CLANG: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup LLVM
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 20

    # bare `clang` comes from the LLVM install above, whose bin/ the setup step puts on PATH:
    # Backend::make_exec links the emitted object by shelling out to unqualified `clang`, so the
    # e2e suite's `mode: build` cases need one. installing the distro `clang` package here instead
    # would put a different major version ahead of it
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake \
          ninja-build \
          libc++-dev \
          libc++abi-dev \
          zlib1g-dev

    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-linux-${{ matrix.arch }}
        max-size: 1G
        save: ${{ github.ref == 'refs/heads/master' }}

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_C_COMPILER="$LLVM_PATH/bin/clang" \
          -DCMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target tests

    - name: Upload test binaries
      uses: actions/upload-artifact@v4
      with:
        name: linux-${{ matrix.arch }}-test-binaries
        path: |
          build/tests
          build/echoc
        if-no-files-found: error
        retention-days: 1

    # x86_64 Linux only, and deliberately: the embedded file order comes from expanding the
    # manifest's #[sources:] globs, which is filesystem order, so comparing bytes across two
    # hosts would be a flake
    - name: Check the committed stdlib header is not stale
      if: matrix.arch == 'x86_64'
      run: |
        : > emit.eco
        ./build/echoc run --emit-stdlib-header emit.eco
        rm emit.eco
        if ! git diff --exit-code -- stdlib/build/stdlib_embedded.h; then
          echo "::error file=stdlib/build/stdlib_embedded.h::The committed embedded stdlib header does not match the stdlib sources. Regenerate it with 'echoc run --emit-stdlib-header <file>.eco' and commit the result."
          exit 1
        fi

    - name: Test stdlib
      working-directory: ${{github.workspace}}/build
      run: ./echoc test -m ../stdlib --track-allocations

  test_linux_unit:
    needs: build_linux
    # a stdlib failure in build_linux must not skip unit, and one arch failing must not skip the other
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # the tests binary was compiled on the build job; these override the baked-in absolute paths
      ECHOC_BINARY: ${{ github.workspace }}/build/echoc

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Test environment
      uses: ./.github/actions/linux-test-env
      with:
        arch: ${{ matrix.arch }}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ./tests "~[e2e]"

  test_linux_e2e:
    needs: build_linux
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # the tests binary was compiled on the build job; these override the baked-in absolute paths
      ECHOC_BINARY: ${{ github.workspace }}/build/echoc
      ECO_E2E_TESTS_DIR: ${{ github.workspace }}/tests_eco
      ECO_E2E_TMP_DIR: ${{ github.workspace }}/build/e2e_tmp
      # this job installs the WASI SDK and wasmtime; missing tools then FAIL rather than SKIP
      ECO_REQUIRE_WASI: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Test environment
      uses: ./.github/actions/linux-test-env
      with:
        arch: ${{ matrix.arch }}
        wasi: 'true'

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ./tests "[e2e]" --shard ${{ matrix.shard }}/2

  build_windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 20

    - name: Install Ninja
      run: choco install ninja --yes --no-progress

    - name: Compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-windows
        max-size: 1G
        save: ${{ github.ref == 'refs/heads/master' }}

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -G Ninja `
          "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}" `
          "-DCMAKE_C_COMPILER=$env:LLVM_PATH\bin\clang.exe" `
          "-DCMAKE_CXX_COMPILER=$env:LLVM_PATH\bin\clang++.exe" `
          "-DCMAKE_C_COMPILER_LAUNCHER=ccache" `
          "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" `
          "-DLLVM_DIR=$env:LLVM_PATH\lib\cmake\llvm"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ env.BUILD_TYPE }} --target tests

    - name: Upload test binaries
      uses: actions/upload-artifact@v4
      with:
        name: windows-test-binaries
        path: |
          build/tests.exe
          build/echoc.exe
        if-no-files-found: error
        retention-days: 1

    - name: Test stdlib
      working-directory: ${{github.workspace}}/build
      shell: pwsh
      run: .\echoc.exe test -m ../stdlib --track-allocations

  test_windows_unit:
    runs-on: windows-2022
    timeout-minutes: 180
    needs: build_windows
    if: ${{ !cancelled() }}
    env:
      ECHOC_BINARY: ${{ github.workspace }}/build/echoc.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Test environment
      uses: ./.github/actions/windows-test-env

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: pwsh
      run: .\tests.exe "~[e2e]"

  test_windows_e2e:
    runs-on: windows-2022
    timeout-minutes: 180
    needs: build_windows
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # the tests binary was compiled on the build job; these override the baked-in absolute paths
      ECHOC_BINARY: ${{ github.workspace }}/build/echoc.exe
      ECO_E2E_TESTS_DIR: ${{ github.workspace }}/tests_eco
      ECO_E2E_TMP_DIR: ${{ github.workspace }}/build/e2e_tmp
      # windows-2022 is two cores. hardware_concurrency() can still report four, and four echocs
      # compiling the stdlib into isolated `--build-dir` trees starve each other past the case deadline
      ECO_E2E_JOBS: 2

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Test environment
      uses: ./.github/actions/windows-test-env

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: pwsh
      run: .\tests.exe "[e2e]" --shard ${{ matrix.shard }}/3

  # the version the release binaries are stamped with and the tag the release gets. Resolved once, so
  # every platform and the release itself cannot disagree about what was built
  #
  # the patch number is not stored anywhere: it is the highest v<major>.<minor>.<patch> tag plus one,
  # so bumping ECO_VERSION_MINOR in include/eco.h by hand starts a series at .0 with no second edit
  # and no commit pushed back onto master
  resolve_version:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      patch: ${{ steps.resolve.outputs.patch }}
      suffix: ${{ steps.resolve.outputs.suffix }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # the whole history, because the tags *are* the input
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail

          major=$(sed -n 's/^#define ECO_VERSION_MAJOR \([0-9][0-9]*\).*$/\1/p' include/eco.h)
          minor=$(sed -n 's/^#define ECO_VERSION_MINOR \([0-9][0-9]*\).*$/\1/p' include/eco.h)

          if [ -z "$major" ] || [ -z "$minor" ]; then
            echo "Could not read ECO_VERSION_MAJOR / ECO_VERSION_MINOR from include/eco.h." >&2
            exit 1
          fi

          # the highest patch in this series, or -1 when the series has no tag yet - so a new series
          # starts at 0 and an existing one continues
          highest=$(git tag --list "v${major}.${minor}.*" \
            | sed -n "s/^v${major}\.${minor}\.\([0-9][0-9]*\)$/\1/p" \
            | sort -n \
            | tail -1)
          highest=${highest:--1}

          patch=$((highest + 1))
          version="${major}.${minor}.${patch}"

          # a binary built off a branch says so, so one that was handed to somebody can never be
          # mistaken for a release
          suffix=""
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            suffix="-dev+$(git rev-parse --short HEAD)"
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists, refusing to resolve it again." >&2
            exit 1
          fi

          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

          echo "Resolved ${version}${suffix} (previous patch in series: ${highest})"

  build_release_unix:
    needs: resolve_version
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported glibc, so the binary runs on 22.04 and newer
          - runner: ubuntu-22.04
            bin: echo-linux-x86_64
            epm: epm-linux-x86_64
            wasi: x86_64
          - runner: ubuntu-22.04-arm
            bin: echo-linux-arm64
            epm: epm-linux-arm64
            wasi: arm64
          - runner: macos-15
            bin: echo-macos-arm64
            epm: epm-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      USE_CLANG: 1
      BIN_NAME: ${{ matrix.bin }}
      EPM_BIN_NAME: ${{ matrix.epm }}
      VERSION: ${{needs.resolve_version.outputs.version}}${{needs.resolve_version.outputs.suffix}}
      ECO_VERSION_PATCH: ${{needs.resolve_version.outputs.patch}}
      ECO_VERSION_SUFFIX: ${{needs.resolve_version.outputs.suffix}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 20

      # libzstd-dev is here for its *static* half: LLVM links zstd, and the release build puts it
      # inside the binary rather than naming it - see ECO_STATIC_ZSTD in CMakeLists.txt
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake \
            ninja-build \
            make \
            libc++-dev \
            libc++abi-dev \
            zlib1g-dev \
            libzstd-dev

      # zstd is here for its *static* half - see ECO_STATIC_ZSTD in CMakeLists.txt. The shared one is
      # already on the runner, which is exactly the problem: it lives under /opt/homebrew, and that
      # path does not exist on the Mac that downloads the result
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja zstd

      - name: Install WASI SDK
        if: matrix.wasi
        run: |
          curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-27/wasi-sdk-27.0-${{ matrix.wasi }}-linux.tar.gz" \
            | sudo tar xz -C /opt
          sudo ln -sfn "/opt/wasi-sdk-27.0-${{ matrix.wasi }}-linux" /opt/wasi-sdk
          echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "$GITHUB_ENV"

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ matrix.bin }}
          max-size: 1G

      - name: Static libcurl cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/static-curl
          key: static-curl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_static_curl.sh') }}

      - name: Build, smoke and package the release
        run: ./tools/build_release_unix.sh

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.BIN_NAME}}
          path: ${{github.workspace}}/${{env.BIN_NAME}}.tar.gz

      - name: Upload epm archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.EPM_BIN_NAME}}
          path: ${{github.workspace}}/${{env.EPM_BIN_NAME}}.tar.gz

  build_release_windows_x86_64:
    runs-on: windows-2022
    timeout-minutes: 180
    needs: resolve_version
    env:
      BUILD_TYPE: Release
      BIN_NAME: echo-windows-x86_64
      EPM_BIN_NAME: epm-windows-x86_64
      VERSION: ${{needs.resolve_version.outputs.version}}${{needs.resolve_version.outputs.suffix}}
      ECO_VERSION_PATCH: ${{needs.resolve_version.outputs.patch}}
      ECO_VERSION_SUFFIX: ${{needs.resolve_version.outputs.suffix}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 20

      - name: Install Ninja and Inno Setup
        run: choco install ninja innosetup --yes --no-progress

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-echo-windows-x86_64
          max-size: 1G

      - name: Static libcurl cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/static-curl
          key: static-curl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_static_curl.sh') }}

      - name: Build the Windows release
        shell: pwsh
        run: ./tools/windows/build_release.ps1

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.BIN_NAME}}
          path: ${{github.workspace}}/${{env.BIN_NAME}}.zip

      - name: Upload epm archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.EPM_BIN_NAME}}
          path: ${{github.workspace}}/${{env.EPM_BIN_NAME}}.zip

      - name: Upload setup wizard
        uses: actions/upload-artifact@v4
        with:
          name: echo-windows-x86_64-setup
          path: ${{github.workspace}}/echo-windows-x86_64-setup.exe

  # every push to master is a patch release. `gh release create` creates the tag itself, so nothing
  # here pushes a ref by hand and nothing commits back onto the branch
  release:
    runs-on: ubuntu-24.04
    needs:
      - resolve_version
      - build_linux
      - test_linux_unit
      - test_linux_e2e
      - build_windows
      - test_windows_unit
      - test_windows_e2e
      - build_release_unix
      - build_release_windows_x86_64
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    # the attestation below is signed with this run's OIDC identity, and stored against the repository
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{echo,epm}-*'

      # one flat directory of exactly what is published, so checksums, attestation and the release name the same files
      - name: Checksum the release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/echo-linux-x86_64/echo-linux-x86_64.tar.gz \
             artifacts/echo-linux-arm64/echo-linux-arm64.tar.gz \
             artifacts/echo-macos-arm64/echo-macos-arm64.tar.gz \
             artifacts/echo-windows-x86_64/echo-windows-x86_64.zip \
             artifacts/epm-linux-x86_64/epm-linux-x86_64.tar.gz \
             artifacts/epm-linux-arm64/epm-linux-arm64.tar.gz \
             artifacts/epm-macos-arm64/epm-macos-arm64.tar.gz \
             artifacts/epm-windows-x86_64/epm-windows-x86_64.zip \
             artifacts/echo-windows-x86_64-setup/echo-windows-x86_64-setup.exe \
             release/
          (cd release && sha256sum -- * > SHA256SUMS)

      # a checksum only catches a corrupted download; the attestation ties each asset to this workflow run
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/*'

      # asked again here rather than trusted from resolve_version: the builds took minutes, and a tag
      # that appeared meanwhile means this run's number is somebody else's
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{needs.resolve_version.outputs.tag}}
          VERSION: ${{needs.resolve_version.outputs.version}}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists - another run got there first." >&2
            exit 1
          fi

          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "echo ${TAG}" \
            --generate-notes \
            release/*
