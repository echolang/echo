name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [RelWithDebInfo]

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      # CXX_FLAGS: "-stdlib=libc++ -std=c++20"
      USE_CLANG: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup LLVM
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 20

    # bare `clang` comes from the LLVM install above, whose bin/ the setup step puts on PATH:
    # Backend::make_exec links the emitted object by shelling out to unqualified `clang`, so the
    # e2e suite's `mode: build` cases need one. installing the distro `clang` package here instead
    # would put a different major version ahead of it
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake \
          ninja-build \
          libc++-dev \
          libc++abi-dev \
          zlib1g-dev

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_C_COMPILER="$LLVM_PATH/bin/clang" \
          -DCMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++" \
          -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target tests

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ./tests

  build_release:
    runs-on: ubuntu-24.04
    needs: build_and_test
    env:
      BUILD_TYPE: Release
      USE_CLANG: 1
      BIN_NAME: echo-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 20
  
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake \
            ninja-build \
            libc++-dev \
            libc++abi-dev \
            zlib1g-dev
  
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_C_COMPILER="$LLVM_PATH/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++" \
            -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"

      - name: Build release
        run: |
          cmake --build ${{github.workspace}}/build --config Release --target echoc
          cp ${{github.workspace}}/build/echoc ${{github.workspace}}/${{env.BIN_NAME}}
  
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.BIN_NAME}}
          path: ${{github.workspace}}/${{env.BIN_NAME}}

  build_release_macos_arm64:
    runs-on: macos-15
    needs: build_and_test
    env:
      BUILD_TYPE: Release
      USE_CLANG: 1
      BIN_NAME: echo-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
  
      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 20

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"

      - name: Build release
        run: |
          cmake --build ${{github.workspace}}/build --config Release --target echoc
          cp ${{github.workspace}}/build/echoc ${{github.workspace}}/${{env.BIN_NAME}}

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.BIN_NAME}}
          path: ${{github.workspace}}/${{env.BIN_NAME}}

