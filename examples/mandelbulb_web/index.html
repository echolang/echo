<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Echo Mandelbulb</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
            background: #111;
            color: #eee;
            display: grid;
            justify-items: center;
            gap: 12px;
            padding: 24px 16px;
        }
        h1 { margin: 0 0 4px; }
        canvas {
            width: 640px;
            max-width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 4px;
        }
        .bar {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 720px;
        }
        .sliders {
            display: grid;
            grid-template-columns: auto 200px 3.5em;
            gap: 4px 10px;
            align-items: center;
        }
        .sliders output { color: #9ad; font-variant-numeric: tabular-nums; }
        #status { color: #9ad; }
        label { color: #bbb; }
        table {
            border-collapse: collapse;
            font-variant-numeric: tabular-nums;
        }
        th, td {
            padding: 4px 12px;
            text-align: right;
        }
        th:first-child, td:first-child { text-align: left; }
        th { color: #888; font-weight: normal; }
        tr.active td:first-child { color: #9ad; }
        #verdict { color: #cda; min-height: 1.4em; text-align: center; }
    </style>
</head>
<body>
    <h1>Mandelbulb: Echo vs JavaScript</h1>
    <canvas id="view" width="320" height="240"></canvas>
    <div class="bar">
        <label>backend
            <select id="backend">
                <option value="echo">Echo (wasm)</option>
                <option value="js">JavaScript</option>
            </select>
        </label>
        <label>resolution
            <select id="resolution">
                <option value="160x120">160 × 120</option>
                <option value="320x240" selected>320 × 240</option>
                <option value="640x480">640 × 480</option>
            </select>
        </label>
        <button id="reset" type="button">reset</button>
        <button id="bench" type="button">benchmark</button>
    </div>
    <div class="sliders">
        <label for="power">power</label>
        <input id="power" type="range" min="2" max="12" step="0.5" value="8">
        <output for="power"></output>
        <label for="iters">iterations</label>
        <input id="iters" type="range" min="4" max="16" step="1" value="8">
        <output for="iters"></output>
        <label for="yaw">yaw</label>
        <input id="yaw" type="range" min="0" max="360" step="1" value="30">
        <output for="yaw"></output>
        <label for="pitch">pitch</label>
        <input id="pitch" type="range" min="-80" max="80" step="1" value="20">
        <output for="pitch"></output>
        <label for="distance">distance</label>
        <input id="distance" type="range" min="1.6" max="4" step="0.05" value="2.6">
        <output for="distance"></output>
    </div>
    <span id="status">loading…</span>
    <table>
        <thead>
            <tr><th>compute ms</th><th>last</th><th>avg of 10</th><th>best</th></tr>
        </thead>
        <tbody id="results"></tbody>
    </table>
    <div id="verdict"></div>
    <p>Times are compute only, not the canvas paint. Use benchmark for a number worth quoting.</p>
    <script>
        // keep each slider's readout next to it, independent of the renderer
        for (const out of document.querySelectorAll('.sliders output')) {
            const input = document.getElementById(out.htmlFor.value);
            const show = () => { out.textContent = input.value; };
            input.addEventListener('input', show);
            show();
        }
    </script>
    <script type="module" src="web/main.js"></script>
</body>
</html>
